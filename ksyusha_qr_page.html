<title>our legend memory</title>
<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f0eb}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:34px 20px;
  color:#24211f;
  font-family:'Cormorant Garamond', Georgia, serif;
}
.page{
  width:min(520px,100%);
  text-align:center;
  padding:22px 0 18px;
}
.label{
  font-family:'Montserrat',Arial,sans-serif;
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:#817a73;
  margin-bottom:22px;
}
.photo-wrap{
  position:relative;
  padding:10px;
  background:#fffdf9;
  box-shadow:0 18px 45px rgba(45,38,32,.14);
}
.photo{
  display:block;
  width:100%;
  height:auto;
  max-height:68vh;
  object-fit:contain;
}
.message{
  margin:29px auto 0;
  max-width:450px;
  font-size:29px;
  line-height:1.15;
  font-weight:500;
  letter-spacing:.1px;
}
.second{
  margin-top:12px;
  font-size:22px;
  line-height:1.2;
  font-weight:400;
  color:#5f5852;
}
.divider{
  width:34px;
  height:1px;
  background:#bdb5ad;
  margin:25px auto 17px;
}
.signature{
  font-family:'Montserrat',Arial,sans-serif;
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#9a9189;
}
@media(max-width:420px){
  body{padding:24px 15px}
  .message{font-size:26px}
  .second{font-size:20px}
}
</style>
